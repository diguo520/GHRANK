<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHRANK // SKILLS MARKET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/css/index.css">
  <link rel="stylesheet" href="../styles/css/header.css">
  <link rel="stylesheet" href="../styles/css/footer.css">
  <link rel="stylesheet" href="../styles/css/side-nav.css?v=4">
  <link rel="stylesheet" href="../styles/css/search-overlay.css">
  <link rel="stylesheet" href="../styles/css/loading.css">
  <link rel="stylesheet" href="../styles/css/skills.css?v=12">
  <script src="../js/vendor/react-cjs-shim.js"></script>
  <script src="../js/vendor/babel.min.js"></script>
</head>
<body>

<div id="chrome-root"></div>
<div id="chrome-body"></div>

<div class="scan-line"></div>

<div id="chrome-ticker"></div>
<div id="chrome-navbar"></div>

<div class="main-content">

  <!-- HERO -->
  <section class="skills-hero">
    <div class="skills-hero-badge">&#9670; AGENT SKILLS MARKET &#9670;</div>
    <h1 class="skills-hero-title">
      <span class="gold-glow">SKILLS</span> MARKET
    </h1>
    <p class="skills-hero-sub">Discover, compare and install community-built Agent Skills. Curated by GHRANK.</p>
    <div class="skills-hero-stats">
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="statTotalSkills">0</div>
        <div class="skills-hero-stat-label">Total Skills</div>
      </div>
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="statTotalOwners">0</div>
        <div class="skills-hero-stat-label">Creators</div>
      </div>
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="statTotalCategories">0</div>
        <div class="skills-hero-stat-label">Categories</div>
      </div>
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="statTotalInstalls">0</div>
        <div class="skills-hero-stat-label">Installs</div>
      </div>
    </div>
  </section>

  <!-- CONTROLS -->
  <section class="skills-controls">
    <div class="skills-search">
      <span class="skills-search-icon">&#x1F50D;&#xFE0E;</span>
      <input type="text" class="skills-search-input" id="skillSearchInput" placeholder="Search skills...">
    </div>
  </section>

  <!-- MAIN LAYOUT -->
  <div class="skills-layout">
    <!-- SIDEBAR — 多维度筛选面板 -->
    <aside class="skills-sidebar">
      <div class="skills-filter-panel">
        <div class="skills-filter-header">
          <span class="skills-filter-title">&lt;// FILTERS</span>
          <a href="#" class="skills-filter-clear" id="filterClearAll">Clear All</a>
        </div>
        <div class="skills-filter-divider"></div>
        <div class="skills-filter-body" id="skillsFilterBody">
          <!-- JS 渲染下拉 + 按钮组 -->
        </div>
      </div>
    </aside>

    <!-- LIST -->
    <div class="skills-grid" id="skillsGrid">
      <!-- 列表表头 -->
      <div class="skills-list-header">
        <span style="text-align:center">#</span>
        <span style="text-align:center">Trend</span>
        <span>Skill</span>
        <span class="col-tags">Tags</span>
        <span style="text-align:right">Installs</span>
        <span class="col-sparkline" style="text-align:right">Activity</span>
      </div>

      <!-- 骨架屏占位：行式布局，由 JS 逐批替换为真实卡片 -->
      <div class="skeleton-card skills-card" data-skeleton-idx="0">
        <div class="skeleton-line" style="width:28px;height:18px;margin:0 auto"></div>
        <div class="skeleton-line" style="width:20px;height:18px;margin:0 auto"></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="skeleton-line medium" style="height:14px;width:130px"></div><div class="skeleton-line short" style="height:12px;width:110px"></div></div>
        <div class="skeleton-line" style="width:60px;height:16px"></div>
        <div class="skeleton-line" style="width:90px;height:14px;margin-left:auto"></div>
        <div class="skeleton-line" style="width:60px;height:24px;margin-left:auto"></div>
      </div>
      <div class="skeleton-card skills-card" data-skeleton-idx="1">
        <div class="skeleton-line" style="width:28px;height:18px;margin:0 auto"></div>
        <div class="skeleton-line" style="width:20px;height:18px;margin:0 auto"></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="skeleton-line medium" style="height:14px;width:130px"></div><div class="skeleton-line short" style="height:12px;width:110px"></div></div>
        <div class="skeleton-line" style="width:60px;height:16px"></div>
        <div class="skeleton-line" style="width:90px;height:14px;margin-left:auto"></div>
        <div class="skeleton-line" style="width:60px;height:24px;margin-left:auto"></div>
      </div>
      <div class="skeleton-card skills-card" data-skeleton-idx="2">
        <div class="skeleton-line" style="width:28px;height:18px;margin:0 auto"></div>
        <div class="skeleton-line" style="width:20px;height:18px;margin:0 auto"></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="skeleton-line medium" style="height:14px;width:130px"></div><div class="skeleton-line short" style="height:12px;width:110px"></div></div>
        <div class="skeleton-line" style="width:60px;height:16px"></div>
        <div class="skeleton-line" style="width:90px;height:14px;margin-left:auto"></div>
        <div class="skeleton-line" style="width:60px;height:24px;margin-left:auto"></div>
      </div>
      <div class="skeleton-card skills-card" data-skeleton-idx="3">
        <div class="skeleton-line" style="width:28px;height:18px;margin:0 auto"></div>
        <div class="skeleton-line" style="width:20px;height:18px;margin:0 auto"></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="skeleton-line medium" style="height:14px;width:130px"></div><div class="skeleton-line short" style="height:12px;width:110px"></div></div>
        <div class="skeleton-line" style="width:60px;height:16px"></div>
        <div class="skeleton-line" style="width:90px;height:14px;margin-left:auto"></div>
        <div class="skeleton-line" style="width:60px;height:24px;margin-left:auto"></div>
      </div>
      <div class="skeleton-card skills-card" data-skeleton-idx="4">
        <div class="skeleton-line" style="width:28px;height:18px;margin:0 auto"></div>
        <div class="skeleton-line" style="width:20px;height:18px;margin:0 auto"></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="skeleton-line medium" style="height:14px;width:130px"></div><div class="skeleton-line short" style="height:12px;width:110px"></div></div>
        <div class="skeleton-line" style="width:60px;height:16px"></div>
        <div class="skeleton-line" style="width:90px;height:14px;margin-left:auto"></div>
        <div class="skeleton-line" style="width:60px;height:24px;margin-left:auto"></div>
      </div>
      <div class="skeleton-card skills-card" data-skeleton-idx="5">
        <div class="skeleton-line" style="width:28px;height:18px;margin:0 auto"></div>
        <div class="skeleton-line" style="width:20px;height:18px;margin:0 auto"></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="skeleton-line medium" style="height:14px;width:130px"></div><div class="skeleton-line short" style="height:12px;width:110px"></div></div>
        <div class="skeleton-line" style="width:60px;height:16px"></div>
        <div class="skeleton-line" style="width:90px;height:14px;margin-left:auto"></div>
        <div class="skeleton-line" style="width:60px;height:24px;margin-left:auto"></div>
      </div>

      <!-- 无限滚动触发器 —— 位于列表容器内末尾，与其他页面统一 -->
      <div class="infinite-scroll-sentinel" id="skillsSentinel">
        <div class="scroll-loader">
          <div class="scroll-loader-spinner"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="chrome-footer"></div>
<div id="overlay-root"></div>

<script src="../js/skills-data.js?v=3"></script>
<script src="../js/skills.js?v=14"></script>
<script type="text/babel" src="../js/core.js?v=4"></script>
</body>
</html>
