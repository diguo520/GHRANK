<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHRANK // SKILLS CATEGORIES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/css/index.css">
  <link rel="stylesheet" href="../styles/css/header.css">
  <link rel="stylesheet" href="../styles/css/footer.css">
  <link rel="stylesheet" href="../styles/css/side-nav.css?v=4">
  <link rel="stylesheet" href="../styles/css/search-overlay.css">
  <link rel="stylesheet" href="../styles/css/loading.css">
  <link rel="stylesheet" href="../styles/css/skills.css?v=15">
  <script src="../js/vendor/react-cjs-shim.js"></script>
  <script src="../js/vendor/babel.min.js"></script>
</head>
<body>

<div id="chrome-root"></div>
<div id="chrome-body"></div>

<div class="scan-line"></div>

<div id="chrome-ticker"></div>
<div id="chrome-navbar"></div>

<div class="main-content">

  <!-- HERO -->
  <section class="skills-hero">
    <div class="skills-hero-badge">&#9670; SKILL CATEGORIES &#9670;</div>
    <h1 class="skills-hero-title">
      <span class="gold-glow">CATEGORIES</span>
    </h1>
    <p class="skills-hero-sub">Top 10 skills per category, ranked by installs. Track trends at a glance.</p>
    <div class="skills-hero-stats">
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="catStatTop">0</div>
        <div class="skills-hero-stat-label">Top Categories</div>
      </div>
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="catStatSub">0</div>
        <div class="skills-hero-stat-label">Sub-Categories</div>
      </div>
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="catStatSkills">0</div>
        <div class="skills-hero-stat-label">Total Skills</div>
      </div>
      <div class="skills-hero-stat">
        <div class="skills-hero-stat-value" id="catStatLargest">0</div>
        <div class="skills-hero-stat-label">Largest Category</div>
      </div>
    </div>
  </section>

  <!-- 面包屑 -->
  <div class="skills-cat-breadcrumb">
    <a href="skills.html">Skills Market</a>
    <span class="sep">/</span>
    <span class="current">Categories</span>
  </div>

  <!-- 分类排行列表 — 骨架屏占位 + sentinel 无限滚动 -->
  <div class="skills-cat-list" id="categoryList">
    <!-- 骨架屏占位：3 个分类区块，每块含 10 行 -->
    <div class="skeleton-card skills-cat-section" data-skeleton-idx="0">
      <div class="skills-cat-section-header">
        <div class="skeleton-line" style="width:48px;height:48px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skeleton-line medium" style="height:18px;width:160px"></div>
          <div class="skeleton-line short" style="height:12px;width:80px;margin-top:6px"></div>
        </div>
      </div>
      <div class="skills-cat-section-body">
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
      </div>
    </div>
    <div class="skeleton-card skills-cat-section" data-skeleton-idx="1">
      <div class="skills-cat-section-header">
        <div class="skeleton-line" style="width:48px;height:48px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skeleton-line medium" style="height:18px;width:140px"></div>
          <div class="skeleton-line short" style="height:12px;width:70px;margin-top:6px"></div>
        </div>
      </div>
      <div class="skills-cat-section-body">
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
      </div>
    </div>
    <div class="skeleton-card skills-cat-section" data-skeleton-idx="2">
      <div class="skills-cat-section-header">
        <div class="skeleton-line" style="width:48px;height:48px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skeleton-line medium" style="height:18px;width:120px"></div>
          <div class="skeleton-line short" style="height:12px;width:60px;margin-top:6px"></div>
        </div>
      </div>
      <div class="skills-cat-section-body">
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
        <div class="skeleton-line" style="height:36px"></div>
      </div>
    </div>

    <!-- 无限滚动触发器 -->
    <div class="infinite-scroll-sentinel" id="catSentinel">
      <div class="scroll-loader">
        <div class="scroll-loader-spinner"></div>
      </div>
    </div>
  </div>

</div>

<div id="chrome-footer"></div>
<div id="overlay-root"></div>

<script src="../js/skills-data.js?v=3"></script>
<script src="../js/skills.js?v=18"></script>
<script type="text/babel" src="../js/core.js?v=4"></script>
</body>
</html>
